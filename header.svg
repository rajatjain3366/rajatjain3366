<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .name { font: 700 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .desc { font: 500 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #4fc3f7; letter-spacing: 3px; }
      .fade1 { animation: fade 1.2s ease-out 0.2s both; }
      .fade2 { animation: fade 1.2s ease-out 0.8s both; }
      .wave  { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes fade  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>

  <path fill="url(#bg)" d="M0 0 H1200 V180 C1000 230 850 150 600 185 C350 220 200 150 0 190 Z"/>
  <path class="wave" fill="#4fc3f7" fill-opacity="0.08" d="M0 160 C200 120 400 210 650 170 C900 130 1050 200 1300 160 V230 H0 Z"/>

  <text class="name fade1" x="600" y="100" text-anchor="middle">Rajat Jain</text>
  <text class="desc fade2" x="600" y="140" text-anchor="middle">FULL-STACK DEVELOPER • BACKEND &amp; DEVOPS</text>
</svg>
